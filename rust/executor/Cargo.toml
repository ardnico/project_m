[package]
name = "executor"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
async-nats = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
parking_lot = "0.12"
uuid = { version = "1.4", features = ["v4", "serde"] }
